[project]
name = "institutional-trading-bot-status"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "pydantic>=2.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.112"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
