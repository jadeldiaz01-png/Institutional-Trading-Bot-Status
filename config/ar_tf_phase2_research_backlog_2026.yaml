research_tracks:
  - id: PH2_TSMOM_RECENCY_REPLICATION
    class: alpha
    priority: P1
    evidence_sources: [SRC_TSMOM_RECENCY_2026]
    data_requirement: certified_daily_pit_spot
    hypothesis: time_series_momentum_may_be_more_robust_than_cross_sectional_momentum_net_of_costs_but_must_survive_recent_regimes
    mandatory_comparators:
      - long_cash_tsmom
      - long_flat_tsmom
      - xsmom
      - buy_and_hold_btc
      - equal_weight_pit
    required_tests:
      - common_oos_folds
      - recent_period_subsample_fixed_ex_ante
      - base_stressed_severe_costs
      - paired_block_bootstrap
      - dsr
      - pbo
      - white_rc
      - hansen_spa
      - parameter_plateau
      - regime_decomposition
      - delisting_terminal_stress

  - id: PH2_RISK_MANAGED_MOMENTUM
    class: risk_overlay_and_alpha_challenger
    priority: P1
    evidence_sources: [SRC_RISK_MANAGED_MOMENTUM_2025]
    data_requirement: certified_daily_pit_spot
    hypothesis: ex_ante_volatility_scaling_may_improve_net_momentum_economics_without_using_future_information
    mandatory_comparators:
      - unscaled_same_signal
      - capped_inverse_vol
      - equal_weight_pit
      - buy_and_hold_btc
    controls:
      - volatility_estimate_strictly_lagged
      - leverage_forbidden_in_spot_research
      - max_gross_exposure_1
      - max_asset_weight_fixed_ex_ante
      - turnover_and_cost_penalty
    required_tests:
      - same_signal_same_folds
      - paired_net_return_test
      - parameter_plateau
      - stress_concentration
      - regime_year_asset_liquidity_stability

  - id: PH2_REGIME_CONDITIONED_MOMENTUM
    class: alpha
    priority: P1
    evidence_sources: [SRC_STATE_TRANSITION_MOMENTUM_2025]
    data_requirement: certified_daily_pit_spot
    hypothesis: momentum_payoff_may_be_state_dependent_and_should_be_tested_with_ex_ante_state_rules
    state_policy:
      state_definition_must_be_frozen_ex_ante: true
      states: [up_up, up_down, down_up, down_down]
      probabilistic_regime_authorization_forbidden: true
    required_tests:
      - state_classifier_leakage_audit
      - state_transition_confusion_stability
      - common_oos_folds
      - multiplicity_adjustment
      - base_stressed_severe_costs
      - parameter_plateau
      - transition_frequency_minimum
      - no_state_with_catastrophic_tail_dependence

  - id: PH2_RESIDUAL_MOMENTUM_FACTOR_NEUTRAL
    class: alpha
    priority: P2
    evidence_sources: [SRC_CRYPTO_FACTOR_MODEL_2026]
    data_requirement: certified_daily_pit_spot
    hypothesis: residualized_momentum_may_add_information_beyond_market_and_plain_momentum
    candidate_factors:
      - market
      - momentum_2w
      - residual_momentum
    controls:
      - factor_construction_strictly_point_in_time
      - no_full_sample_residualization
      - fit_only_inside_training_window
      - same_oos_folds_as_simple_baselines
      - residualization_ablation_required
    required_tests:
      - incremental_value_vs_plain_momentum
      - dsr
      - pbo
      - white_rc_or_hansen_spa
      - paired_block_bootstrap
      - factor_loading_stability
      - regime_stability

  - id: PH2_HEAVY_TAIL_ROBUSTNESS_GATE
    class: validation_and_risk
    priority: P0
    alpha_credit_allowed: false
    hypothesis: crypto_return_and_strategy_distributions_require_tail_robust_evaluation_beyond_variance_only_metrics
    metrics:
      - expected_shortfall_95
      - expected_shortfall_99
      - max_drawdown
      - drawdown_duration
      - lower_partial_moment
      - median_return
      - mad_scale
      - hill_tail_index_sensitivity
      - tail_dependence_by_liquidity_bucket
    statistical_controls:
      - moving_block_bootstrap
      - stationary_bootstrap_sensitivity
      - winsorization_results_must_not_be_primary
      - sharpe_is_supplementary_not_authoritative
      - minimum_tail_event_count
    fail_conditions:
      - unstable_tail_index
      - severe_cost_tail_expectancy_nonpositive
      - liquidity_bucket_tail_concentration
      - single_asset_dominates_tail_payoff

  - id: PH2_SURVIVORSHIP_LIFECYCLE_CHALLENGE
    class: data_integrity
    priority: P0
    evidence_sources: [SRC_SURVIVOR_MOMENTUM_2026]
    alpha_credit_allowed: false
    requirements:
      - point_in_time_symbol_universe
      - delisted_and_defaulted_markets_retained
      - listing_and_delisting_timestamps
      - symbol_renames_and_migrations
      - terminal_loss_policy
      - no_current_universe_backfill
      - liquidity_eligibility_strictly_lagged
    required_tests:
      - survivor_only_placebo
      - full_lifecycle_baseline
      - delisting_terminal_stress
      - missing_data_adversarial_test

  - id: PH2_INTRADAY_LIQUIDITY_STATE
    class: microstructure_research
    priority: P2
    evidence_sources: [SRC_QUARTER_HOUR_2026]
    data_requirement: certified_l2_trades_clock_quality
    forbidden_proxy: daily_ohlcv
    features:
      - quoted_spread
      - realized_spread
      - depth_adjusted_spread
      - order_flow_imbalance
      - trade_intensity
      - realized_volatility
      - clock_phase
      - session
      - weekend
    required_controls:
      - strictly_lagged_features
      - no_same_interval_target_leakage
      - maker_taker_separation
      - queue_fill_uncertainty
      - adverse_selection_cost
      - timestamp_clock_drift_monitoring
      - venue_specific_model_only

  - id: PH2_PORTFOLIO_ALLOCATOR_ABLATION
    class: risk_overlay
    priority: P2
    alpha_credit_allowed: false
    comparators:
      - capped_equal_weight
      - inverse_vol
      - capped_inverse_vol
      - hrp
      - correlation_clustered_risk_budget
    required_tests:
      - turnover_costs
      - spa_family_test
      - parameter_stability
      - stress_concentration
      - tail_risk_comparison
      - capacity_comparison

  - id: PH2_EXECUTION_POLICY_MATRIX
    class: execution
    priority: P1
    environment_minimum: TESTNET
    alpha_credit_allowed: false
    policies:
      - limit_gtc
      - post_only
      - bbo_queue
      - bbo_counterparty
      - twap
      - pov
      - oco_otoco_protective
    point_in_time_exchange_inputs:
      - account_fee_tier
      - bnb_fee_discount_state
      - promotional_pair_fee_state
      - price_filter
      - lot_size
      - min_notional_or_notional
      - tick_size
      - step_size
      - self_trade_prevention_mode
      - request_weight_limits
      - order_rate_limits
    telemetry:
      - implementation_shortfall_bps
      - fill_ratio
      - partial_fill_ratio
      - reject_rate
      - maker_taker_mix
      - latency_p50_ms
      - latency_p95_ms
      - latency_p99_ms
      - spread_capture_bps
      - adverse_selection_bps
      - cancel_replace_rate
    mandatory_failure_cases:
      - websocket_gap
      - rate_limit_exhaustion
      - insufficient_liquidity
      - partial_fill_timeout
      - duplicate_client_order_id
      - self_trade_prevention
      - exchange_filter_change
      - fee_schedule_change
      - stale_exchange_info

  - id: PH2_CAPACITY_IMPACT_GATE
    class: production_economics
    priority: P1
    alpha_credit_allowed: false
    requirements:
      - order_size_over_adv
      - order_size_over_visible_depth
      - participation_rate_sweep
      - empirical_impact_curve
      - liquidity_bucket_concentration
      - stress_day_capacity
      - nonlinear_impact_sensitivity
      - strategy_capacity_break_even

  - id: PH2_FUNDING_BASIS_FUTURE_SLEEVE
    class: deferred_derivatives
    priority: P3
    enabled: false
    requires_separate_certification:
