name: ar-tf-research

on:
  pull_request:
    paths:
      - 'src/ar_tf/**'
      - 'tests/**'
      - 'config/ar_tf_v1.yaml'
      - 'config/ar_tf_v1d_tournament.yaml'
      - 'schemas/ar_tf_dataset.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/ar-tf-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar-tf-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Assert research-only certificate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ar-tf-certification-template.json'))
          assert d['decision']=='NO_GO'
          assert d['paper_authorized'] is False
          print('research gate fail-closed: OK')
          PY
