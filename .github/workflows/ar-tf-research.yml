name: ar-tf-research

on:
  pull_request:
    paths:
      - 'src/ar_tf/**'
      - 'tests/**'
      - 'config/ar_tf_v1.yaml'
      - 'schemas/ar_tf_dataset.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/ar-tf-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Assert research-only certificate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ar-tf-certification-template.json'))
          assert d['decision']=='NO_GO'
          assert d['paper_authorized'] is False
          print('research gate fail-closed: OK')
          PY

  historical-evidence-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Enumerate and verify real Binance Vision historical USDT universe
        run: python -m ar_tf.evidence_runner --output-dir artifacts/ar_tf_v1d2 --timeout 60
      - name: Assert evidence governance
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ar_tf_v1d2/evidence-readiness.json'))
          assert d['paper_authorized'] is False
          assert d['decision'] in {'NO_GO','HISTORICAL_DOWNLOAD_READY'}
          assert d['provenance']['discovered_symbol_count'] > 0
          assert d['provenance']['observation_count'] > 0
          if d['decision']=='HISTORICAL_DOWNLOAD_READY':
              assert d['verified_lifecycle_ready'] is True
              assert d['all_discovered_symbols_resolved'] is True
              assert len(d['verified_lifecycle_sha256']) == 64
          print(json.dumps({
            'decision': d['decision'],
            'symbols': d['provenance']['discovered_symbol_count'],
            'symbols_with_monthly_1d': d['provenance']['symbol_count_with_1d_monthly_archives'],
            'symbols_without_monthly_1d': d.get('symbols_without_monthly_1d', []),
            'observations': d['provenance']['observation_count'],
            'symbols_sha256': d['provenance']['discovered_symbols_sha256'],
            'observations_sha256': d['provenance']['observations_sha256'],
            'candidates_sha256': d['provenance']['candidates_sha256'],
            'verified_lifecycle_sha256': d.get('verified_lifecycle_sha256'),
            'reasons': d.get('reasons'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ar-tf-v1d2-historical-evidence
          path: artifacts/ar_tf_v1d2/
          if-no-files-found: error

  historical-dataset-download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: historical-evidence-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ar-tf-v1d2-historical-evidence
          path: artifacts/ar_tf_v1d2
      - name: Evaluate historical download gate
        id: gate
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open('artifacts/ar_tf_v1d2/evidence-readiness.json'))
          ready = d.get('decision') == 'HISTORICAL_DOWNLOAD_READY' and d.get('all_discovered_symbols_resolved') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
          print(json.dumps({'ready': ready, 'decision': d.get('decision'), 'reasons': d.get('reasons')}, indent=2))
          PY
      - name: Download and checksum-verify complete monthly OHLCV history
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m ar_tf.historical_dataset \
            --evidence-dir artifacts/ar_tf_v1d2 \
            --output-dir artifacts/ar_tf_v1d2_dataset \
            --workers 24 \
            --timeout 60
      - name: Validate dataset manifest
        if: steps.gate.outputs.ready == 'true' && success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ar_tf_v1d2_dataset/dataset-manifest.json'))
          assert d['point_in_time'] is True
          assert d['holdout_evaluated'] is False
          assert d['paper_authorized'] is False
          assert d['archive_count'] > 0
          assert d['market_episode_count'] > 0
          assert len(d['dataset_sha256']) == 64
          print(json.dumps({
            'dataset_sha256': d['dataset_sha256'],
            'archive_count': d['archive_count'],
            'market_episode_count': d['market_episode_count'],
            'historical_symbol_count': d['historical_symbol_count'],
            'lifecycle_sha256': d['verified_lifecycle_sha256'],
            'holdout_evaluated': d['holdout_evaluated'],
          }, indent=2))
          PY
      - name: Upload historical dataset evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: ar-tf-v1d2-historical-dataset
          path: artifacts/ar_tf_v1d2_dataset/
          if-no-files-found: error
          compression-level: 6
