name: ar-tf-research

on:
  pull_request:
    paths:
      - 'src/ar_tf/**'
      - 'tests/**'
      - 'config/ar_tf_v1.yaml'
      - 'schemas/ar_tf_dataset.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/ar-tf-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Assert research-only certificate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ar-tf-certification-template.json'))
          assert d['decision']=='NO_GO'
          assert d['paper_authorized'] is False
          print('research gate fail-closed: OK')
          PY

  historical-evidence-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Enumerate and verify real Binance Vision historical USDT universe
        run: python -m ar_tf.evidence_runner --output-dir artifacts/ar_tf_v1d2 --timeout 60
      - name: Assert evidence governance
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/ar_tf_v1d2/evidence-readiness.json'))
          assert d['paper_authorized'] is False
          assert d['decision'] in {'NO_GO','HISTORICAL_DOWNLOAD_READY'}
          assert d['provenance']['discovered_symbol_count'] > 0
          assert d['provenance']['observation_count'] > 0
          if d['decision']=='HISTORICAL_DOWNLOAD_READY':
              assert d['verified_lifecycle_ready'] is True
              assert len(d['verified_lifecycle_sha256']) == 64
          print(json.dumps({
            'decision': d['decision'],
            'symbols': d['provenance']['discovered_symbol_count'],
            'observations': d['provenance']['observation_count'],
            'symbols_sha256': d['provenance']['discovered_symbols_sha256'],
            'observations_sha256': d['provenance']['observations_sha256'],
            'candidates_sha256': d['provenance']['candidates_sha256'],
            'verified_lifecycle_sha256': d.get('verified_lifecycle_sha256'),
            'reasons': d.get('reasons'),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ar-tf-v1d2-historical-evidence
          path: artifacts/ar_tf_v1d2/
          if-no-files-found: error
