name: CP03 fold-06 low-perturbation memory diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cp03-fold06-low-perturbation-memory
  cancel-in-progress: false

env:
  SCIENTIFIC_SHA: '8da2171e97970c66b3ba5a237c426d9871cc23a1'
  SOURCE_SHA: '8da2171e97970c66b3ba5a237c426d9871cc23a1'
  CP02_ARTIFACT_ID: '10419024917'
  CP02_ARTIFACT_DIGEST: 'sha256:974d02bbce33d7809c6cc3f44a21f3d2e249ec320d7362e18fedd584e20e25ce'
  SOURCE_RUN_ID: '35557179691'
  TRIAL_INDEX: '0'
  FOLD_ID: '6'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: control
      - name: Checkout exact frozen science
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SCIENTIFIC_SHA }}
          path: science
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: science/pyproject.toml
      - name: Verify and install frozen science
        working-directory: science
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCIENTIFIC_SHA"; test "$SOURCE_SHA" = "$SCIENTIFIC_SHA"
          git diff --exit-code; git diff --cached --exit-code
          python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Restore immutable CP02 and folds 00-05
        working-directory: science
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p artifacts/g4_g13
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}" > cp02-meta.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}/zip" > cp02.zip
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path("cp02-meta.json").read_text()); actual="sha256:"+hashlib.sha256(Path("cp02.zip").read_bytes()).hexdigest()
          assert str(m["id"])==os.environ["CP02_ARTIFACT_ID"] and m.get("expired") is False
          assert actual==os.environ["CP02_ARTIFACT_DIGEST"]==m.get("digest")
          PY
          unzip -q cp02.zip -d artifacts/g4_g13
          (cd artifacts/g4_g13 && sha256sum -c checkpoint-02.sha256)
          TRIAL_ID="$(python - <<'PY'
          import json,os
          from pathlib import Path
          from ar_tf.ridge_resume import trial_at
          r=json.loads(Path("artifacts/g4_g13/preregistration/preregistered-trial-registry.json").read_text())
          print(str(trial_at(r,int(os.environ["TRIAL_INDEX"]))["trial_id"]))
          PY
          )"
          test -n "$TRIAL_ID"
          export TRIAL_ID
          printf 'TRIAL_ID=%s\n' "$TRIAL_ID" >> "$GITHUB_ENV"
          mkdir -p "artifacts/ridge_fold_checkpoints/${TRIAL_ID}"
          for fid in 00 01 02 03 04 05; do
            name="ar-tf-ridge-fold-00-${fid}"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?name=${name}&per_page=100")"
            test "$(printf '%s' "$meta"|jq -r '.total_count')" -eq 1
            id="$(printf '%s' "$meta"|jq -r '.artifacts[0].id')"; digest="$(printf '%s' "$meta"|jq -r '.artifacts[0].digest')"
            test "$(printf '%s' "$meta"|jq -r '.artifacts[0].expired')" = false
            zip="/tmp/${name}.zip"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
            test "sha256:$(sha256sum "$zip"|cut -d' ' -f1)" = "$digest"
            dest="artifacts/ridge_fold_checkpoints/${TRIAL_ID}/fold-${fid}"; mkdir -p "$dest"; unzip -q "$zip" -d "$dest"
            test -s "$dest/manifest.json"; test -s "$dest/payload.json"
          done
      - name: Deterministic pre-materialization bounds
        working-directory: science
        run: |
          mkdir -p diagnostics
          python ../control/scripts/diagnostics/preflight_cp03_fold06_memory.py
      - name: Capture runner metadata
        working-directory: science
        run: |
          { echo "timestamp_utc=$(date -u +%FT%T.%NZ)"; echo "scientific_sha=$SCIENTIFIC_SHA"; uname -a; lscpu; cat /proc/meminfo; } > diagnostics/runner-metadata.txt
      - name: Run untouched scientific process under external supervisor
        working-directory: science
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          SCIENCE_ROOT="$PWD" python ../control/scripts/diagnostics/semantic_cp03_fold06_boundaries.py > >(tee diagnostics/science.stdout.log) 2>diagnostics/science.stderr.log &
          science_pid=$!
          # Stream each memory sample to the Actions log as a second evidence sink.
          # The CSV remains the primary artifact when the runner survives; stdout is
          # incrementally captured by GitHub and remains useful if later steps cannot run.
          python ../control/scripts/diagnostics/proc_memory_supervisor.py "$science_pid" diagnostics/proc-memory.csv 0.25 --stdout &
          supervisor_pid=$!
          # Keep a hard margin before the 25-minute GitHub job timeout so
          # evidence can be sealed and uploaded even when fold 06 does not exit.
          watchdog_deadline_seconds=900
          (
            sleep "$watchdog_deadline_seconds"
            if kill -0 "$science_pid" 2>/dev/null; then
              printf 'WATCHDOG_DEADLINE seconds=%s pid=%s\\n' "$watchdog_deadline_seconds" "$science_pid" | tee diagnostics/watchdog.log
              kill -TERM "$science_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "$science_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!
          set +e; wait "$science_pid"; rc=$?; set -e
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          wait "$supervisor_pid" || true
          echo "$rc" > diagnostics/science-exit-code.txt
          if test -s diagnostics/watchdog.log; then
            echo "WATCHDOG_TERMINATED=true"
            exit 124
          fi
          exit "$rc"
      - name: Seal diagnostic evidence
        if: always()
        working-directory: science
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          test ! -e artifacts/g4_g13/checkpoint-03-final.json
          git diff --exit-code; git diff --cached --exit-code
          (cd diagnostics && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS)
          echo "LOW_PERTURBATION_DIAGNOSTIC_ONLY=true"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-fold06-low-perturbation-memory
          path: science/diagnostics/
          if-no-files-found: error
          retention-days: 30
