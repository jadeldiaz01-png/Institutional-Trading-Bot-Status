name: ar-tf-ridge-fold-resume-contract

on:
  pull_request:
    paths:
      - 'src/ar_tf/ml_trials.py'
      - 'src/ar_tf/ridge_fold_resume.py'
      - 'src/ar_tf/ridge_resume.py'
      - 'src/ar_tf/ridge_checkpoint_cli.py'
      - 'src/ar_tf/ridge_reduce.py'
      - 'tests/test_ar_tf_ridge_fold_resume.py'
      - 'tests/test_ar_tf_ridge_resume.py'
      - '.github/workflows/ar-tf-ridge-fold-resume-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  fold-resume-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify exact source SHA
        env:
          SOURCE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify real monolith/resume equivalence and fail-closed contracts
        run: |
          pytest -q \
            tests/test_ar_tf_ridge_fold_resume.py \
            tests/test_ar_tf_ridge_resume.py \
            tests/test_ar_tf_g4_g13.py \
            tests/test_ar_tf_structural_tournament.py \
            tests/test_ar_tf_trial_registry.py \
            tests/test_ar_tf_dataset_binding.py
