name: p0-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Unit and property gates
        run: pytest
      - name: Assert live trading remains disabled in repository
        shell: bash
        run: |
          if grep -R --line-number --exclude-dir=.git -E 'LIVE_TRADING_ENABLED[=: ]+true' .; then
            echo 'Forbidden: repository enables live trading'
            exit 1
          fi
          echo 'LIVE trading remains disabled by repository policy.'
