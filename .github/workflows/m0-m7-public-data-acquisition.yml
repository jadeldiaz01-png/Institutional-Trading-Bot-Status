name: M0-M7 public data acquisition

on:
  pull_request:
    paths:
      - '.github/workflows/m0-m7-public-data-acquisition.yml'
      - 'experiments/m0_m7_edge_search/acquisition-authority.json'
      - 'src/edge_lab/feature_pipeline.py'
      - 'scripts/build_m0_m7_point_in_time.py'
      - 'scripts/run_m0_m7_ablation.py'
      - 'src/edge_lab/ablation.py'
      - 'tests/test_m0_m7*.py'
  workflow_dispatch:
    inputs:
      expected_origin_main_sha:
        description: Exact origin main SHA recorded by the acquisition authority contract
        required: true
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: m0-m7-public-data-acquisition
  cancel-in-progress: false

env:
  AUTHORIZED_ORIGIN_SHA: 'b30d39d75a73b6cd001e5f2f007283c05ca2c669'
  IMPLEMENTATION_BASE_SHA: 'c17aea029f96a1bc0db5133accd40634ec8ccd96'
  AUTHORITY_CONTRACT_SHA256: '50aa994c466ff22d171cd7b70df09a8383dfd0c5f6be38e2befceaa974f55c2a'
  LEDGER_BRANCH: 'evidence/m0-m7-public-data-ledger'

jobs:
  acquire:
    name: public-readonly-acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout acquisition code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2

      - name: Fail closed on authority and lineage
        env:
          EXPECTED_ORIGIN_MAIN_SHA: ${{ inputs.expected_origin_main_sha }}
        run: |
          set -euo pipefail

          contract="experiments/m0_m7_edge_search/acquisition-authority.json"
          test -f "$contract"
          echo "$AUTHORITY_CONTRACT_SHA256  $contract" | sha256sum -c -

          python3 - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(Path("experiments/m0_m7_edge_search/protocol.json").read_text())
          a = protocol["authority"]
          assert a["edge_verified"] is False
          assert a["holdout_access"] == "FORBIDDEN"
          assert a["paper_authorized"] is False
          assert a["testnet_authorized"] is False
          assert a["live_authorized"] is False

          contract = json.loads(Path("experiments/m0_m7_edge_search/acquisition-authority.json").read_text())
          assert contract["authorized_origin_main_sha"] == "b30d39d75a73b6cd001e5f2f007283c05ca2c669"
          assert contract["implementation_base_sha"] == "c17aea029f96a1bc0db5133accd40634ec8ccd96"
          assert contract["mode"] == "RESEARCH_ONLY"
          auto = contract["automatic_research_ablation"]
          assert auto["enabled"] is True
          assert auto["minimum_decision_timestamps"] == 313
          assert auto["models_require_complete_oos_features"] is True
          assert auto["edge_verification_authority"] is False
          assert auto["promotion_authority"] is False
          assert len(contract["universe"]["spot_symbols"]) >= 2
          assert contract["universe"]["benchmark_symbol"] in contract["universe"]["spot_symbols"]
          s = contract["safety"]
          assert s["EDGE_VERIFIED"] is False
          assert s["credentials_allowed"] is False
          assert s["account_access_allowed"] is False
          assert s["orders_allowed"] is False
          assert s["capital_movement_allowed"] is False
          assert s["holdout_access_allowed"] is False
          assert s["paper_authorized"] is False
          assert s["testnet_authorized"] is False
          assert s["live_authorized"] is False
          print("RESEARCH_ONLY_AUTHORITY=PASS")
          PY

          event="$GITHUB_EVENT_NAME"
          if [ "$event" = "workflow_dispatch" ]; then
            test "$EXPECTED_ORIGIN_MAIN_SHA" = "$AUTHORIZED_ORIGIN_SHA"
            test "$GITHUB_REF" = "refs/heads/main"
          elif [ "$event" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.sha }}" = "$IMPLEMENTATION_BASE_SHA"
          elif [ "$event" = "schedule" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          else
            echo "unsupported event: $event" >&2
            exit 1
          fi

      - name: Acquire and verify public archives
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf run-evidence
          mkdir -p run-evidence

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode, urlparse

          OUT = Path("run-evidence")
          fetched_at = datetime.now(timezone.utc)
          candidate_days = [
              (fetched_at.date() - timedelta(days=1)).isoformat(),
              (fetched_at.date() - timedelta(days=2)).isoformat(),
          ]
          contract = json.loads(Path("experiments/m0_m7_edge_search/acquisition-authority.json").read_text())
          spot_symbols = contract["universe"]["spot_symbols"]
          allowed_hosts = {"data.binance.vision", "community-api.coinmetrics.io"}

          def get_bytes(url: str, timeout: float = 30.0) -> bytes:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in allowed_hosts:
                  raise RuntimeError(f"host not allowlisted: {parsed.hostname}")
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "*/*",
                      "User-Agent": "institutional-trading-bot-status-edge-lab/2.0",
                  },
                  method="GET",
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}: {url}")
                  return response.read()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def download_binance_archive(kind: str, url_builder):
              errors = []
              for day in candidate_days:
                  url = url_builder(day)
                  try:
                      zip_bytes = get_bytes(url)
                      checksum_bytes = get_bytes(url + ".CHECKSUM")
                      expected = checksum_bytes.decode("utf-8").strip().split()[0].lower()
                      actual = sha256(zip_bytes)
                      if len(expected) != 64 or expected != actual:
                          raise RuntimeError(f"checksum mismatch expected={expected} actual={actual}")
                      with zipfile.ZipFile(io.BytesIO(zip_bytes)) as archive:
                          names = archive.namelist()
                          if len(names) != 1:
                              raise RuntimeError(f"unexpected archive members: {names}")
                          csv_bytes = archive.read(names[0])
                      lines = [line for line in csv_bytes.decode("utf-8").splitlines() if line.strip()]
                      if not lines:
                          raise RuntimeError("empty extracted CSV")

                      (OUT / f"{kind}-{day}.zip").write_bytes(zip_bytes)
                      (OUT / f"{kind}-{day}.csv").write_bytes(csv_bytes)
                      (OUT / f"{kind}-{day}.CHECKSUM").write_bytes(checksum_bytes)
                      return {
                          "kind": kind,
                          "date": day,
                          "url": url,
                          "zip_sha256": actual,
                          "csv_sha256": sha256(csv_bytes),
                          "line_count": len(lines),
                          "binance_checksum_verified": True,
                      }
                  except Exception as exc:
                      errors.append({"date": day, "error": str(exc)})
              raise RuntimeError(f"{kind} unavailable for candidate days: {errors}")

          spot_sources = {}
          for symbol in spot_symbols:
              spot_sources[symbol] = download_binance_archive(
                  f"spot-klines-{symbol}-1h",
                  lambda day, symbol=symbol: (
                      "https://data.binance.vision/data/spot/daily/klines/"
                      f"{symbol}/1h/{symbol}-1h-{day}.zip"
                  ),
              )

          derivatives_klines = download_binance_archive(
              "coinm-klines-BTCUSD_PERP-1h",
              lambda day: (
                  "https://data.binance.vision/data/futures/cm/daily/klines/"
                  f"BTCUSD_PERP/1h/BTCUSD_PERP-1h-{day}.zip"
              ),
          )
          metrics = download_binance_archive(
              "coinm-metrics-BTCUSD_PERP",
              lambda day: (
                  "https://data.binance.vision/data/futures/cm/daily/metrics/"
                  f"BTCUSD_PERP/BTCUSD_PERP-metrics-{day}.zip"
              ),
          )

          onchain_start = (fetched_at.date() - timedelta(days=4)).isoformat()
          onchain_end = fetched_at.date().isoformat()
          params = {
              "assets": "btc",
              "metrics": "AdrActCnt,TxCnt,FeeTotNtv",
              "start_time": onchain_start,
              "end_time": onchain_end,
              "frequency": "1d",
              "page_size": 10000,
              "paging_from": "start",
          }
          onchain_url = (
              "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?"
              + urlencode(params)
          )
          onchain_bytes = get_bytes(onchain_url)
          onchain = json.loads(onchain_bytes.decode("utf-8"))
          rows = onchain.get("data", [])
          if not rows:
              raise RuntimeError("Coin Metrics Community API returned no rows")
          onchain_path = OUT / f"coinmetrics-btc-onchain-{fetched_at.date().isoformat()}.json"
          onchain_path.write_bytes(onchain_bytes)

          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          manifest = {
              "schema_version": "2.0.0",
              "evidence_class": "M0_M7_PUBLIC_DATA_ACQUISITION",
              "authorized_origin_sha": os.environ["AUTHORIZED_ORIGIN_SHA"],
              "implementation_base_sha": os.environ["IMPLEMENTATION_BASE_SHA"],
              "authority_contract_sha256": os.environ["AUTHORITY_CONTRACT_SHA256"],
              "workflow_source_sha": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": run_id,
              "run_attempt": attempt,
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "fetched_at": fetched_at.isoformat(),
              "sources": {
                  "spot_market": spot_sources,
                  "derivatives_klines": derivatives_klines,
                  "derivatives_metrics": metrics,
                  "derivatives_funding": {
                      "status": "MONTHLY_ARCHIVE_ONLY",
                      "daily_archive_available": False,
                      "note": "No synthetic daily substitute was used."
                  },
                  "onchain": {
                      "url": onchain_url,
                      "path": str(onchain_path),
                      "sha256": sha256(onchain_bytes),
                      "row_count": len(rows),
                      "start_time": onchain_start,
                      "end_time": onchain_end,
                  },
              },
              "safety": {
                  "credentials_used": False,
                  "account_accessed": False,
                  "orders_placed": False,
                  "holdout_accessed": False,
                  "paper_authorized": False,
                  "testnet_authorized": False,
                  "live_authorized": False,
                  "EDGE_VERIFIED": False,
              },
              "decision": "PUBLIC_DATA_ACQUISITION_PASS",
          }
          (OUT / f"acquisition-manifest-{run_id}-{attempt}.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )

          print("PUBLIC_DATA_ACQUISITION=PASS")
          print(f"SPOT_SYMBOLS={len(spot_sources)}")
          print(f"SPOT_DATE={next(iter(spot_sources.values()))['date']}")
          print(f"DERIVATIVES_DATE={derivatives_klines['date']}")
          print(f"ONCHAIN_ROWS={len(rows)}")
          print("EDGE_VERIFIED=false")
          print("LIVE_AUTHORIZED=false")
          PY

      - name: Seal run evidence
        run: |
          set -euo pipefail
          (
            cd run-evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Build cumulative point-in-time dataset
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf /tmp/m0m7-ledger-view /tmp/m0m7-derived derived-output
          mkdir -p /tmp/m0m7-ledger-view/evidence/m0-m7-public-data/runs

          git fetch origin "refs/heads/$LEDGER_BRANCH:refs/remotes/origin/$LEDGER_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$LEDGER_BRANCH"; then
            if git cat-file -e "refs/remotes/origin/$LEDGER_BRANCH:evidence/m0-m7-public-data/runs" 2>/dev/null; then
              git archive "refs/remotes/origin/$LEDGER_BRANCH" evidence/m0-m7-public-data/runs | tar -x -C /tmp/m0m7-ledger-view
            fi
          fi

          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "/tmp/m0m7-ledger-view/evidence/m0-m7-public-data/runs/$run_key"
          cp -a run-evidence/. "/tmp/m0m7-ledger-view/evidence/m0-m7-public-data/runs/$run_key/"

          python3 scripts/build_m0_m7_point_in_time.py             --input-dir /tmp/m0m7-ledger-view/evidence/m0-m7-public-data/runs             --output-dir /tmp/m0m7-derived

          mkdir -p derived-output
          cp -a /tmp/m0m7-derived/. derived-output/
          (
            cd derived-output
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("derived-output/readiness.json").read_text())
          print(f"DECISION_TIMESTAMPS={r['decision_timestamps']}")
          print(f"ASSET_COUNT={r['asset_count']}")
          print(f"MINIMUM_FOR_FIRST_FOLD={r['minimum_timestamps_for_first_fold']}")
          print(f"DATASET_DECISION={r['decision']}")
          assert r["EDGE_VERIFIED"] is False
          assert r["holdout_accessed"] is False
          assert r["paper_authorized"] is False
          assert r["testnet_authorized"] is False
          assert r["live_authorized"] is False
          PY

      - name: Run research-only ablation gate when dataset is ready
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail

          ready="$(python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("derived-output/readiness.json").read_text())
          print("true" if r["history_ready_for_first_fold"] else "false")
          PY
          )"

          if [ "$ready" = "true" ]; then
            python3 scripts/run_m0_m7_ablation.py               --input derived-output/point_in_time_panel.csv               --output derived-output/ablation-report.json

            python3 - <<'PY'
            import hashlib
            import json
            import os
            from pathlib import Path

            report_path = Path("derived-output/ablation-report.json")
            report = json.loads(report_path.read_text())
            assert report["EDGE_VERIFIED"] is False
            assert report["holdout_accessed"] is False
            assert report["paper_authorized"] is False
            assert report["testnet_authorized"] is False
            assert report["live_authorized"] is False

            digest = hashlib.sha256(report_path.read_bytes()).hexdigest()
            state = {
                "schema_version": "1.0.0",
                "mode": "RESEARCH_ONLY",
                "status": "RESEARCH_ABLATION_COMPLETE",
                "run_id": os.environ["GITHUB_RUN_ID"],
                "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                "workflow_source_sha": os.environ["GITHUB_SHA"],
                "ablation_report_sha256": digest,
                "eligible_models": report["eligible_models"],
                "blocked_models": report["blocked_models"],
                "EDGE_VERIFIED": False,
                "holdout_accessed": False,
                "paper_authorized": False,
                "testnet_authorized": False,
                "live_authorized": False,
                "next_gate": "HUMAN_REVIEW_OF_RESEARCH_RESULTS"
            }
            Path("derived-output/ablation-state.json").write_text(
                json.dumps(state, sort_keys=True, indent=2) + "\n"
            )
            print("ABLATION_GATE=RESEARCH_ABLATION_COMPLETE")
            print("ELIGIBLE_MODELS=" + ",".join(report["eligible_models"]))
            print("BLOCKED_MODELS=" + ",".join(report["blocked_models"]))
            print("EDGE_VERIFIED=false")
            PY
          else
            python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            readiness = json.loads(Path("derived-output/readiness.json").read_text())
            state = {
                "schema_version": "1.0.0",
                "mode": "RESEARCH_ONLY",
                "status": "WAITING_FOR_PROSPECTIVE_DATA",
                "run_id": os.environ["GITHUB_RUN_ID"],
                "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                "workflow_source_sha": os.environ["GITHUB_SHA"],
                "decision_timestamps": readiness["decision_timestamps"],
                "minimum_timestamps_for_first_fold": readiness["minimum_timestamps_for_first_fold"],
                "EDGE_VERIFIED": False,
                "holdout_accessed": False,
                "paper_authorized": False,
                "testnet_authorized": False,
                "live_authorized": False,
                "next_gate": "CONTINUE_AUTOMATIC_ACCUMULATION"
            }
            Path("derived-output/ablation-state.json").write_text(
                json.dumps(state, sort_keys=True, indent=2) + "\n"
            )
            print("ABLATION_GATE=WAITING_FOR_PROSPECTIVE_DATA")
            print(
                f"READINESS={readiness['decision_timestamps']}/"
                f"{readiness['minimum_timestamps_for_first_fold']}"
            )
            print("EDGE_VERIFIED=false")
            PY
          fi

          rm -f derived-output/SHA256SUMS
          (
            cd derived-output
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload immutable acquisition and derived evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: m0-m7-public-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-evidence/
            derived-output/
          if-no-files-found: error
          retention-days: 90

      - name: Persist run and cumulative dataset to ledger branch
        run: |
          set -euo pipefail
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp -a run-evidence "/tmp/m0m7-new-run"
          cp -a derived-output "/tmp/m0m7-new-derived"
          rm -rf run-evidence derived-output

          if git show-ref --verify --quiet "refs/remotes/origin/$LEDGER_BRANCH"; then
            git checkout -B "$LEDGER_BRANCH" "refs/remotes/origin/$LEDGER_BRANCH"
          else
            git checkout -b "$LEDGER_BRANCH"
          fi

          dest="evidence/m0-m7-public-data/runs/$run_key"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/m0m7-new-run/. "$dest/"

          rm -rf evidence/m0-m7-public-data/derived
          mkdir -p evidence/m0-m7-public-data/derived
          cp -a /tmp/m0m7-new-derived/. evidence/m0-m7-public-data/derived/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/m0-m7-public-data/
          git commit -m "evidence: append M0-M7 public data run $run_key"
          git push origin "HEAD:refs/heads/$LEDGER_BRANCH"

          echo "LEDGER_BRANCH=$LEDGER_BRANCH"
          echo "EDGE_VERIFIED=false"
          echo "PAPER_AUTHORIZED=false"
          echo "TESTNET_AUTHORIZED=false"
          echo "LIVE_AUTHORIZED=false"
