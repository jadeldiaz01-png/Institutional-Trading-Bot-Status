name: CP03 artifact-only evidence recovery

on:
  pull_request:
    paths:
      - '.github/workflows/cp03-artifact-only-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CP03_ARTIFACT_ID: '10830103975'
  CP03_ARTIFACT_DIGEST: 'sha256:802f82a63b0cda9b4f397fb545e3325cac37dae7772e735164057203389e5d1e'
  SCIENTIFIC_SHA: '68ab70b0a531b86b1a02db0e404aa69a5a088b95'
  SOURCE_RUN_ID: '36049820261'

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Assert artifact-only recovery contract
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            path = ".github/workflows/cp03-artifact-only-recovery.yml"
            doc = YAML.load_file(path)
            puts "PSYCH_TOP_LEVEL=#{doc.keys.map { |k| [k.class.name, k.inspect] }.inspect}"
            jobs_obj = doc["jobs"]
            puts "PSYCH_JOBS_CLASS=#{jobs_obj.class.name}"
            puts "PSYCH_JOB_KEYS=#{(jobs_obj || {}).keys.map { |k| [k.class.name, k.inspect] }.inspect}"
            abort("jobs mapping missing") unless jobs_obj.is_a?(Hash)
            jobs = jobs_obj.keys.map(&:to_s).sort
            allowed = ["contract", "recover-evidence"].sort
            abort("unexpected job set: #{jobs.inspect}") unless jobs == allowed
            env = doc["env"]
            abort("env mapping missing") unless env.is_a?(Hash)
            expected = {
              "CP03_ARTIFACT_ID" => "10830103975",
              "CP03_ARTIFACT_DIGEST" => "sha256:802f82a63b0cda9b4f397fb545e3325cac37dae7772e735164057203389e5d1e",
              "SCIENTIFIC_SHA" => "68ab70b0a531b86b1a02db0e404aa69a5a088b95"
            }
            expected.each do |key, value|
              actual = env[key].to_s
              abort("#{key} mismatch") unless actual == value
            end
          '

  recover-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download exact immutable CP03 artifact and verify GitHub SHA-256
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP03_ARTIFACT_ID}" > cp03-meta.json
          test "$(jq -r .id cp03-meta.json)" = "$CP03_ARTIFACT_ID"
          test "$(jq -r .expired cp03-meta.json)" = false
          test "$(jq -r .workflow_run.id cp03-meta.json)" = "$SOURCE_RUN_ID"
          test "$(jq -r .workflow_run.head_sha cp03-meta.json)" = "da1ca777e58cd8fe3bb59555b58ce98013552708"
          test "$(jq -r .digest cp03-meta.json)" = "$CP03_ARTIFACT_DIGEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP03_ARTIFACT_ID}/zip" > cp03.zip
          test "sha256:$(sha256sum cp03.zip | cut -d' ' -f1)" = "$CP03_ARTIFACT_DIGEST"
      - name: Verify sealed CP03 scientific lineage before signing
        run: |
          set -euo pipefail
          mkdir cp03
          unzip -q cp03.zip -d cp03
          (cd cp03 && sha256sum -c checkpoint-03-final.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          envelope=json.loads(Path('cp03/evidence/cp03-evidence-envelope.json').read_text())
          provenance=json.loads(Path('cp03/evidence/cp03-slsa-provenance.json').read_text())
          expected='68ab70b0a531b86b1a02db0e404aa69a5a088b95'
          envelope_sha=envelope.get('source_commit_sha')
          provenance_sha=(provenance.get('predicate',{})
              .get('buildDefinition',{})
              .get('externalParameters',{})
              .get('source_commit_sha'))
          if envelope_sha != expected:
              raise SystemExit('envelope source_commit_sha mismatch')
          if provenance_sha != expected:
              raise SystemExit('provenance source_commit_sha mismatch')
          if envelope_sha != provenance_sha:
              raise SystemExit('evidence lineage documents disagree')
          PY
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      - name: Keyless sign exact CP03 GitHub artifact bytes
        run: cosign sign-blob --yes --bundle cp03.sigstore.json cp03.zip
      - name: Verify workflow identity, GitHub OIDC issuer, and signed bytes
        run: |
          cosign verify-blob cp03.zip \
            --bundle cp03.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cp03-artifact-only-recovery\\.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Emit EVIDENCE_INTEGRITY PASS
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out={
            'schema_version':'1.0.0','gate_id':'EVIDENCE_INTEGRITY','passed':True,
            'source_run_id':'36049820261','source_sha':'68ab70b0a531b86b1a02db0e404aa69a5a088b95',
            'cp03_artifact_id':'10830103975',
            'cp03_artifact_digest':'sha256:802f82a63b0cda9b4f397fb545e3325cac37dae7772e735164057203389e5d1e',
            'sigstore_bundle_sha256':hashlib.sha256(Path('cp03.sigstore.json').read_bytes()).hexdigest(),
            'holdout_opened':False,'paper_authorized':False,'testnet_authorized':False,'live_authorized':False
          }
          Path('evidence-integrity.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ar-tf-cp03-artifact-only-sigstore-verification
          path: |
            cp03.sigstore.json
            cp03-meta.json
            evidence-integrity.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
