name: p0-data-runtime-bootstrap

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact authorized commit SHA
        required: true
        type: string

permissions:
  contents: read

env:
  LIVE_TRADING_ENABLED: 'false'
  PAPER_AUTHORIZED: 'false'
  TESTNET_AUTHORIZED: 'false'
  LIVE_AUTHORIZED: 'false'

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
    steps:
      - id: auth
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

  cloudflare-control-plane:
    needs: authorize
    runs-on: ubuntu-latest
    environment: p0-data-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.sha }}"
      - name: Provision/verify Cloudflare Tunnel and R2 bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_NAME: p0-data-certifier
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash infra/cloudflare/provision-cloudflare-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: p0-data-cloudflare-runtime
          path: artifacts/p0_data_runtime/cloudflare-runtime.json
          if-no-files-found: error

  runtime-contract:
    needs:
      - authorize
      - cloudflare-control-plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: Assert runtime remains research-only
        shell: bash
        run: |
          set -euo pipefail
          test "${LIVE_TRADING_ENABLED}" = "false"
          test "${PAPER_AUTHORIZED}" = "false"
          test "${TESTNET_AUTHORIZED}" = "false"
          test "${LIVE_AUTHORIZED}" = "false"
          echo 'P0_DATA_RUNTIME_CONTROL_PLANE_READY'
