name: ar-tf-evidence-machine-contract
on:
  pull_request:
    paths:
      - 'src/ar_tf/evidence_envelope.py'
      - 'src/ar_tf/gate_engine.py'
      - 'src/ar_tf/slsa_provenance.py'
      - 'tests/test_ar_tf_evidence_gate_provenance.py'
      - 'docs/AR_TF_SCIENTIFIC_BUILD_TYPE_V1.md'
      - '.github/workflows/ar-tf-evidence-machine-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: pytest -q tests/test_ar_tf_evidence_gate_provenance.py
      - name: Fail closed governance smoke test
        run: |
          python - <<'PY'
          from ar_tf.gate_engine import GateResult,MANDATORY_GATES,adjudicate
          D='a'*64
          r=[GateResult(g,True,D,{}) for g in MANDATORY_GATES]
          assert adjudicate(r)['decision']=='FROZEN_HOLDOUT_CANDIDATE'
          r[0]=GateResult(MANDATORY_GATES[0],False,D,{})
          x=adjudicate(r)
          assert x['decision']=='NO_EDGE_VERIFIED'
          assert not x['holdout_opened'] and not x['paper_authorized'] and not x['testnet_authorized'] and not x['live_authorized']
          PY
