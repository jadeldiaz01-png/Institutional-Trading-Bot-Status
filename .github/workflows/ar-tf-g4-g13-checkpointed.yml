name: ar-tf-g4-g13-checkpointed

on:
  pull_request:
    paths:
      - '.github/workflows/ar-tf-g4-g13-checkpointed.yml'
      - 'src/ar_tf/classical_tournament.py'
      - 'src/ar_tf/ridge_resume.py'
      - 'src/ar_tf/ridge_reduce.py'
      - 'tests/test_ar_tf_ridge_resume.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ar-tf-ridge-resume-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  CP02_ARTIFACT_ID: '10419024917'
  CP02_ARTIFACT_DIGEST: 'sha256:974d02bbce33d7809c6cc3f44a21f3d2e249ec320d7362e18fedd584e20e25ce'

jobs:
  ridge-shards:
    name: ridge-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Restore immutable checkpoint 02
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/g4_g13
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}" > cp02-meta.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}/zip" > cp02.zip
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('cp02-meta.json').read_text())
          assert str(m['id'])==os.environ['CP02_ARTIFACT_ID'] and m.get('expired') is False
          actual='sha256:'+hashlib.sha256(Path('cp02.zip').read_bytes()).hexdigest()
          assert actual==os.environ['CP02_ARTIFACT_DIGEST']==m.get('digest')
          PY
          unzip -q cp02.zip -d artifacts/g4_g13
          (cd artifacts/g4_g13 && sha256sum -c checkpoint-02.sha256)
      - name: Execute exactly nine preregistered Ridge challengers
        env:
          SHARD: ${{ matrix.shard }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from ar_tf.research_panel import load_research_panel
          from ar_tf.ridge_resume import execute_shard,write_shard
          root=Path('artifacts/g4_g13'); registry_path=root/'preregistration/preregistered-trial-registry.json'; folds=Path('config/ar_tf_oos_folds_2026.yaml')
          registry=json.loads(registry_path.read_text()); panel=load_research_panel(root/'frozen_dataset',folds)
          binding=json.loads(Path('config/ar_tf_frozen_dataset_binding_2026.json').read_text())
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=execute_shard(panel=panel,registry=registry,folds_path=folds,shard=int(os.environ['SHARD']))
          assert len(r['trial_ids'])==9 and not r['failures']
          write_shard(r,Path('ridge-shard'),{'parent_checkpoint_sha256':os.environ['CP02_ARTIFACT_DIGEST'].split(':',1)[1],'source_commit_sha':os.environ['SOURCE_SHA'],'dataset_sha256':binding['dataset_sha256'],'registry_sha256':sha(registry_path),'folds_sha256':sha(folds)})
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ar-tf-ridge-shard-${{ matrix.shard }}
          path: ridge-shard/
          if-no-files-found: error
          retention-days: 90

  ridge-reducer:
    needs: ridge-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.reduce.outputs.decision }}
      gbm_admitted: ${{ steps.reduce.outputs.gbm_admitted }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Restore checkpoint 02 and all three shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/g4_g13 shards
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}/zip" > cp02.zip
          test "sha256:$(sha256sum cp02.zip | cut -d' ' -f1)" = "$CP02_ARTIFACT_DIGEST"
          unzip -q cp02.zip -d artifacts/g4_g13
          (cd artifacts/g4_g13 && sha256sum -c checkpoint-02.sha256)
          gh run download "$GITHUB_RUN_ID" -p 'ar-tf-ridge-shard-*' -D shards
          test -f shards/ar-tf-ridge-shard-0/manifest.json
          test -f shards/ar-tf-ridge-shard-1/manifest.json
          test -f shards/ar-tf-ridge-shard-2/manifest.json
      - name: Reduce 27/27 exactly once and adjudicate with frozen statistics
        id: reduce
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import pandas as pd
          from ar_tf.research_panel import load_research_panel
          from ar_tf.ridge_resume import load_shard
          from ar_tf.ridge_reduce import reduce_and_adjudicate
          from ar_tf.classical_tournament import write_ridge_stage
          root=Path('artifacts/g4_g13'); folds='config/ar_tf_oos_folds_2026.yaml'; panel=load_research_panel(root/'frozen_dataset',folds); registry=json.loads((root/'preregistration/preregistered-trial-registry.json').read_text())
          shards=[load_shard(Path('shards')/f'ar-tf-ridge-shard-{i}') for i in range(3)]
          r=reduce_and_adjudicate(panel=panel,registry=registry,folds_path=folds,structural_base=pd.read_csv(root/'structural/structural-oos-base.csv',index_col=0,parse_dates=True),structural_stressed=pd.read_csv(root/'structural/structural-oos-stressed.csv',index_col=0,parse_dates=True),structural_severe=pd.read_csv(root/'structural/structural-oos-severe.csv',index_col=0,parse_dates=True),shards=shards)
          assert r['trial_count_total']==149 and r['ridge_trial_count']==27 and not r['ridge_failures']; assert not r['holdout_opened'] and not r['holdout_evaluated']; assert not r['paper_authorized'] and not r['testnet_authorized'] and not r['live_authorized']
          write_ridge_stage(r,root/'classical/ridge')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('decision='+r['decision']+'\n'+'gbm_admitted='+str(bool(r['gradient_boosting_admitted'])).lower()+'\n')
          PY
      - name: Equivalence and property tests
        run: pytest -q tests/test_ar_tf_ridge_resume.py tests/test_ar_tf_g4_g13.py tests/test_ar_tf_structural_tournament.py tests/test_ar_tf_trial_registry.py tests/test_ar_tf_dataset_binding.py
      - name: Seal CP03-FINAL lineage
        run: |
          cd artifacts/g4_g13
          rm -f checkpoint-02.sha256
          find . -type f ! -name checkpoint-03-final.sha256 -print0 | sort -z | xargs -0 sha256sum > checkpoint-03-final.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ar-tf-checkpoint-03-final-ridge-27
          path: artifacts/g4_g13/
          if-no-files-found: error
          retention-days: 90

  gbm-gate:
    needs: ridge-reducer
    if: needs.ridge-reducer.outputs.gbm_admitted == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Ridge adjudication admitted GBM, but the independent GBM executor remains uncertified.'
          echo 'Fail closed: no GBM execution, holdout, PAPER, TESTNET, SHADOW, or LIVE authorization.'
          exit 1
