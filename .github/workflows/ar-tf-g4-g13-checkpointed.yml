name: ar-tf-g4-g13-checkpointed

on:
  pull_request:
    paths:
      - '.github/workflows/ar-tf-g4-g13-checkpointed.yml'
      - 'config/ar_tf_frozen_dataset_binding_2026.json'
      - 'config/ar_tf_trial_registry_v1.yaml'
      - 'config/ar_tf_oos_folds_2026.yaml'
      - 'src/ar_tf/bias_audit.py'
      - 'src/ar_tf/preregistration.py'
      - 'src/ar_tf/structural_tournament.py'
      - 'src/ar_tf/classical_tournament.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Scientific runs are immutable by source SHA. A newer commit must not cancel
# an already-running preregistered evaluation.
concurrency:
  group: ar-tf-checkpointed-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  g4-g5-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Resolve and verify immutable frozen dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/g4_g13/frozen_dataset
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          b=json.loads(Path('config/ar_tf_frozen_dataset_binding_2026.json').read_text())
          assert b['binding_type']=='AR_TF_FROZEN_DATASET_BINDING'
          assert b['decision']=='FROZEN_DATASET' and b['frozen'] is True
          assert b['unresolved_count']==0 and b['holdout_evaluated'] is False
          assert not any(b[k] for k in ('paper_authorized','testnet_authorized','shadow_authorized','live_authorized'))
          print(f"BOUND_ARTIFACT_ID={b['source_artifact_id']}")
          print(f"BOUND_RUN_ID={b['source_run_id']}")
          print(f"BOUND_ARTIFACT_DIGEST={b['source_artifact_digest']}")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOUND_ARTIFACT_ID}" > artifacts/g4_g13/artifact-metadata.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOUND_ARTIFACT_ID}/zip" > artifacts/g4_g13/frozen-dataset.zip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=json.loads(Path('config/ar_tf_frozen_dataset_binding_2026.json').read_text())
          m=json.loads(Path('artifacts/g4_g13/artifact-metadata.json').read_text())
          assert int(m['id'])==int(b['source_artifact_id']) and m.get('expired') is False
          assert m.get('digest')==b['source_artifact_digest']
          actual='sha256:'+hashlib.sha256(Path('artifacts/g4_g13/frozen-dataset.zip').read_bytes()).hexdigest()
          assert actual==b['source_artifact_digest']
          PY
          unzip -q artifacts/g4_g13/frozen-dataset.zip -d artifacts/g4_g13/frozen_dataset
      - name: G4 bias audit and G5 exact preregistration
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          from ar_tf.bias_audit import audit_frozen_dataset,write_bias_audit
          from ar_tf.preregistration import build_preregistration,write_preregistration
          r=audit_frozen_dataset('artifacts/g4_g13/frozen_dataset','config/ar_tf_oos_folds_2026.yaml')
          assert r['decision']=='PASS' and r['holdout_values_evaluated'] is False
          write_bias_audit(r,'artifacts/g4_g13/g4-bias-audit.json')
          b=build_preregistration(dataset_binding_path='config/ar_tf_frozen_dataset_binding_2026.json',registry_spec_path='config/ar_tf_trial_registry_v1.yaml',strategy_config_path='config/ar_tf_master_strategy_tournament_2026.yaml',folds_path='config/ar_tf_oos_folds_2026.yaml',source_commit_sha=os.environ['SOURCE_SHA'])
          assert b['manifest']['trial_count']==407 and b['manifest']['holdout_evaluated'] is False
          write_preregistration(b,'artifacts/g4_g13/preregistration')
          PY
      - name: Seal checkpoint 01
        run: |
          cd artifacts/g4_g13
          find . -type f ! -name checkpoint-01.sha256 -print0 | sort -z | xargs -0 sha256sum > checkpoint-01.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ar-tf-checkpoint-01-g4-g5
          path: artifacts/g4_g13/
          if-no-files-found: error
          retention-days: 90

  structural-122:
    needs: g4-g5-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Restore checkpoint 01
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/g4_g13
          gh run download "$GITHUB_RUN_ID" -n ar-tf-checkpoint-01-g4-g5 -D artifacts/g4_g13
          (cd artifacts/g4_g13 && sha256sum -c checkpoint-01.sha256)
      - name: Execute 122 structural trials and structural certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ar_tf.research_panel import load_research_panel
          from ar_tf.structural_tournament import run_structural_tournament,write_structural_tournament
          from ar_tf.g4_g13_contract import evaluate_g4_g13,write_certificate
          root=Path('artifacts/g4_g13')
          panel=load_research_panel(root/'frozen_dataset','config/ar_tf_oos_folds_2026.yaml')
          registry=json.loads((root/'preregistration/preregistered-trial-registry.json').read_text())
          t=run_structural_tournament(panel,registry,'config/ar_tf_oos_folds_2026.yaml')
          assert t['trial_count_executed']==122 and not t['holdout_evaluated'] and not t['holdout_opened']
          write_structural_tournament(t,root/'structural')
          g4=json.loads((root/'g4-bias-audit.json').read_text()); g5=json.loads((root/'preregistration/g5-preregistration-manifest.json').read_text())
          c=evaluate_g4_g13(bias_audit=g4,preregistration=g5,tournament=t)
          assert c['gates']['G4']['status']=='PASS' and c['gates']['G5']['status']=='PASS'
          assert c['holdout_evaluated'] is False
          write_certificate(c,root/'g4-g13-structural-certificate.json')
          PY
      - name: Seal checkpoint 02
        run: |
          cd artifacts/g4_g13
          rm -f checkpoint-01.sha256
          find . -type f ! -name checkpoint-02.sha256 -print0 | sort -z | xargs -0 sha256sum > checkpoint-02.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ar-tf-checkpoint-02-structural-122
          path: artifacts/g4_g13/
          if-no-files-found: error
          retention-days: 90

  ridge-27:
    needs: structural-122
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      decision: ${{ steps.ridge.outputs.decision }}
      gbm_admitted: ${{ steps.ridge.outputs.gbm_admitted }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Restore checkpoint 02
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/g4_g13
          gh run download "$GITHUB_RUN_ID" -n ar-tf-checkpoint-02-structural-122 -D artifacts/g4_g13
          (cd artifacts/g4_g13 && sha256sum -c checkpoint-02.sha256)
      - name: Execute exactly 27 preregistered Ridge challengers
        id: ridge
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import pandas as pd
          from ar_tf.classical_tournament import run_ridge_stage,write_ridge_stage
          from ar_tf.research_panel import load_research_panel
          root=Path('artifacts/g4_g13')
          structural=json.loads((root/'structural/structural-tournament.json').read_text())
          assert structural['classical_ml_admitted'] is True
          assert not structural['holdout_evaluated'] and not structural['holdout_opened']
          panel=load_research_panel(root/'frozen_dataset','config/ar_tf_oos_folds_2026.yaml')
          registry=json.loads((root/'preregistration/preregistered-trial-registry.json').read_text())
          r=run_ridge_stage(panel=panel,registry=registry,folds_path='config/ar_tf_oos_folds_2026.yaml',structural_base=pd.read_csv(root/'structural/structural-oos-base.csv',index_col=0,parse_dates=True),structural_stressed=pd.read_csv(root/'structural/structural-oos-stressed.csv',index_col=0,parse_dates=True),structural_severe=pd.read_csv(root/'structural/structural-oos-severe.csv',index_col=0,parse_dates=True))
          assert r['trial_count_total']==149 and r['ridge_trial_count']==27 and not r['ridge_failures']
          assert not r['holdout_opened'] and not r['holdout_evaluated']
          assert not r['paper_authorized'] and not r['testnet_authorized'] and not r['live_authorized']
          write_ridge_stage(r,root/'classical/ridge')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('decision='+r['decision']+'\n')
              f.write('gbm_admitted='+str(bool(r['gradient_boosting_admitted'])).lower()+'\n')
          PY
      - name: Seal checkpoint 03
        if: always()
        run: |
          cd artifacts/g4_g13
          rm -f checkpoint-02.sha256
          find . -type f ! -name checkpoint-03.sha256 -print0 | sort -z | xargs -0 sha256sum > checkpoint-03.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: ar-tf-checkpoint-03-ridge-27
          path: artifacts/g4_g13/
          if-no-files-found: error
          retention-days: 90

  gbm-gate:
    needs: ridge-27
    if: needs.ridge-27.outputs.gbm_admitted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until preregistered GBM executor is independently implemented
        run: |
          echo 'GBM was statistically admitted by Ridge, but no independent GBM executor is certified in this branch.'
          echo 'Refusing to fabricate or silently execute an unimplemented stage.'
          exit 1

  dl-gate:
    needs: [ridge-27, gbm-gate]
    if: always() && needs.ridge-27.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deep-learning stage remains fail-closed
        run: |
          echo 'DL challengers remain preregistered but cannot run until the incremental-value gate and independent executor exist.'
          echo 'holdout_opened=false; PAPER/TESTNET/LIVE remain unauthorized.'

  contract-tests:
    needs: ridge-27
    if: always() && needs.ridge-27.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: pytest -q tests/test_ar_tf_g4_g13.py tests/test_ar_tf_structural_tournament.py tests/test_ar_tf_trial_registry.py tests/test_ar_tf_dataset_binding.py
