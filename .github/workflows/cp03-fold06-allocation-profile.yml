name: CP03 fold-06 allocation profile

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cp03-fold06-allocation-profile
  cancel-in-progress: false

env:
  SCIENTIFIC_SHA: '8da2171e97970c66b3ba5a237c426d9871cc23a1'
  SOURCE_SHA: '8da2171e97970c66b3ba5a237c426d9871cc23a1'
  CP02_ARTIFACT_ID: '10419024917'
  CP02_ARTIFACT_DIGEST: 'sha256:974d02bbce33d7809c6cc3f44a21f3d2e249ec320d7362e18fedd584e20e25ce'
  SOURCE_RUN_ID: '35557179691'
  TRIAL_INDEX: '0'
  FOLD_ID: '6'

jobs:
  profile-fold-06:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: control

      - name: Checkout exact frozen science
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SCIENTIFIC_SHA }}
          path: science

      - name: Verify scientific tree is exact and clean
        working-directory: science
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCIENTIFIC_SHA"
          test "$SOURCE_SHA" = "$SCIENTIFIC_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -f src/ar_tf/ml_trials.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: science/pyproject.toml

      - name: Install exact scientific runtime
        working-directory: science
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Restore immutable CP02 into scientific workspace
        working-directory: science
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p artifacts/g4_g13
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}" > cp02-meta.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CP02_ARTIFACT_ID}/zip" > cp02.zip
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path("cp02-meta.json").read_text())
          actual="sha256:"+hashlib.sha256(Path("cp02.zip").read_bytes()).hexdigest()
          assert str(m["id"])==os.environ["CP02_ARTIFACT_ID"]
          assert m.get("expired") is False
          assert actual==os.environ["CP02_ARTIFACT_DIGEST"]==m.get("digest")
          PY
          unzip -q cp02.zip -d artifacts/g4_g13
          (cd artifacts/g4_g13 && sha256sum -c checkpoint-02.sha256)

      - name: Resolve frozen trial identity
        working-directory: science
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json,os
          from pathlib import Path
          from ar_tf.ridge_resume import trial_at
          reg=json.loads(Path("artifacts/g4_g13/preregistration/preregistered-trial-registry.json").read_text())
          print("TRIAL_ID="+str(trial_at(reg,int(os.environ["TRIAL_INDEX"]))["trial_id"]))
          PY

      - name: Restore exact durable folds 00-05
        working-directory: science
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p "artifacts/ridge_fold_checkpoints/${TRIAL_ID}"
          for fid in 00 01 02 03 04 05; do
            name="ar-tf-ridge-fold-00-${fid}"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?name=${name}&per_page=100")"
            test "$(printf '%s' "$meta" | jq -r '.total_count')" -eq 1
            test "$(printf '%s' "$meta" | jq -r '.artifacts[0].expired')" = false
            id="$(printf '%s' "$meta" | jq -r '.artifacts[0].id')"
            digest="$(printf '%s' "$meta" | jq -r '.artifacts[0].digest')"
            zip="/tmp/${name}.zip"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
            test "sha256:$(sha256sum "$zip"|cut -d' ' -f1)" = "$digest"
            dest="artifacts/ridge_fold_checkpoints/${TRIAL_ID}/fold-${fid}"
            mkdir -p "$dest"; unzip -q "$zip" -d "$dest"
            test -s "$dest/manifest.json"; test -s "$dest/payload.json"
          done

      - name: Profile original fold-06 path without modifying science
        env:
          SCIENCE_ROOT: '${{ github.workspace }}/science'
        run: |
          set -euo pipefail
          /usr/bin/time -v python control/scripts/diagnostics/profile_cp03_fold06_allocations.py

      - name: Verify diagnostic never modified tracked science
        if: always()
        working-directory: science
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test ! -e artifacts/g4_g13/checkpoint-03-final.json
          echo "ALLOCATION_PROFILE_ONLY=true"
