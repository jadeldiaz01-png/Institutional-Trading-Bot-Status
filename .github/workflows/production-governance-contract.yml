name: production-governance-contract
on:
  pull_request:
    paths:
      - 'config/production_governance_2026.json'
      - 'docs/PRODUCTION_GOVERNANCE_ARCHITECTURE_2026.md'
      - '.github/workflows/production-governance-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate fail-closed governance invariants
        shell: python
        run: |
          import json
          from pathlib import Path
          m=json.loads(Path("config/production_governance_2026.json").read_text())
          assert m["default_decision"]=="DENY"
          assert m["holdout"]["state"]=="CLOSED"
          assert m["capital"]["autonomous_capital_usd"]==0
          assert m["capital"]["live_trading_enabled"] is False
          assert m["capital"]["ai_may_authorize_live"] is False
          r=m["ridge_cp03"]
          assert r["expected_trials"]*r["expected_folds_per_trial"]==r["expected_checkpoints"]==324
          assert all(v==0 for v in r["required_counts"].values())
          assert r["required_reduction"]=={"ridge_trials":27,"total_trials":149}
          assert m["model_admission"]["llm"]["live_authority"] is False
          assert m["model_admission"]["deep_learning"]["live_authority"] is False
          assert m["model_admission"]["rl"]["live_authority"] is False
          assert m["non_trading_revenue_agents"]["financial_trading_authority"]=="NONE"
