name: p0b-testnet-integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_DB: trading_testnet
          POSTGRES_USER: trading_runtime
          POSTGRES_PASSWORD: ci_test_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trading_runtime -d trading_testnet"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TESTNET_DATABASE_DSN: postgresql://trading_runtime:ci_test_only_not_a_secret@127.0.0.1:5432/trading_testnet
      OPA_URL: http://127.0.0.1:8181
      BAO_ADDR: http://127.0.0.1:8200
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Apply PostgreSQL P0 migration
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          sql = Path('migrations/0001_p0_core.sql').read_text()
          with psycopg.connect(os.environ['TESTNET_DATABASE_DSN'], autocommit=True) as conn:
              conn.execute(sql)
          PY
      - name: Start OPA with repository policy
        run: |
          docker run -d --rm --name p0b-opa -p 8181:8181 \
            -v "$GITHUB_WORKSPACE/policy:/policy:ro" \
            openpolicyagent/opa:1.17.0-static \
            run --server --addr=0.0.0.0:8181 /policy/order_intent.rego
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/health && exit 0
            sleep 1
          done
          docker logs p0b-opa
          exit 1
      - name: Start isolated OpenBao smoke instance
        shell: bash
        run: |
          ROOT_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run -d --rm --name p0b-openbao -p 8200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID="$ROOT_TOKEN" \
            ghcr.io/openbao/openbao:2.6.1 \
            server -dev -dev-listen-address=0.0.0.0:8200
          unset ROOT_TOKEN
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8200/v1/sys/health && exit 0
            sleep 1
          done
          docker logs p0b-openbao
          exit 1
      - name: Unit failure-mode gates
        run: pytest -m 'not integration' tests/test_p0_b_failure_modes.py tests/test_p0_controls.py
      - name: PostgreSQL OPA Evidence integration gates
        run: pytest -m integration tests/test_p0_b_integration.py
      - name: Assert PROD remains disabled
        run: test "$LIVE_TRADING_ENABLED" = "false"
      - name: Capture component versions
        run: |
          docker image inspect postgres:18.0 --format '{{.Id}}'
          docker image inspect openpolicyagent/opa:1.17.0-static --format '{{.Id}}'
          docker image inspect ghcr.io/openbao/openbao:2.6.1 --format '{{.Id}}'
