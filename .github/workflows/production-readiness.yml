name: production-readiness

on:
  pull_request:
    paths:
      - 'src/ar_tf/production_readiness.py'
      - 'tests/test_production_readiness.py'
      - 'schemas/production-readiness-manifest.schema.json'
      - 'docs/PRODUCTION_READINESS_MANIFEST_2026.md'
      - '.github/workflows/production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_production_readiness.py
      - name: Assert default deny
        run: |
          python - <<'PY'
          from ar_tf.production_readiness import evaluate_readiness
          r=evaluate_readiness(source_commit_sha='0'*40)
          assert r.manifest['decision']=='NO_GO'
          assert not any(r.manifest['authorizations'].values())
          print('production-readiness default-deny: OK')
          PY
