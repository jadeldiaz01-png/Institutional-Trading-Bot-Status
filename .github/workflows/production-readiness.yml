name: production-readiness

on:
  pull_request:
    paths:
      - 'src/ar_tf/production_readiness.py'
      - 'src/ar_tf/evidence_validation.py'
      - 'tests/test_production_readiness.py'
      - 'tests/test_private_certifier_contract.py'
      - 'schemas/production-readiness-manifest.schema.json'
      - 'docs/PRODUCTION_READINESS_MANIFEST_2026.md'
      - 'docs/PRIVATE_CERTIFICATION_INFRA_2026.md'
      - 'infra/private-certifier/**'
      - '.github/workflows/private-certifier-runtime.yml'
      - 'pyproject.toml'
      - '.github/workflows/production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Test readiness evaluator, private certifier contract, and JSON Schema contract
        run: pytest -q tests/test_production_readiness.py tests/test_private_certifier_contract.py
      - name: Generate deterministic fail-closed manifest for evaluated SHA
        env:
          EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ar_tf.production_readiness import evaluate_readiness, write_readiness

          sha=os.environ['EVALUATED_SHA']
          r=evaluate_readiness(source_commit_sha=sha)
          assert r.manifest['decision']=='NO_GO'
          assert r.manifest['live_ready'] is False
          assert len(r.manifest['gates']) == 33
          assert not any(r.manifest['authorizations'].values())
          write_readiness(r, Path('artifacts/production_readiness'))
          print(r.canonical_sha256)
          PY
      - name: Verify generated artifact against schema and checksum
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root=Path('artifacts/production_readiness')
          manifest_path=root/'trading-production-readiness-manifest.json'
          checksum_path=root/'trading-production-readiness-manifest.sha256'
          schema=json.loads(Path('schemas/production-readiness-manifest.schema.json').read_text())
          manifest=json.loads(manifest_path.read_text())
          errors=list(Draft202012Validator(schema).iter_errors(manifest))
          assert not errors, [e.message for e in errors]
          expected=checksum_path.read_text().split()[0]
          canonical=json.dumps(manifest, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          actual=hashlib.sha256(canonical).hexdigest()
          assert actual == expected
          assert manifest['decision']=='NO_GO'
          assert manifest['live_ready'] is False
          print({'manifest_sha256': actual, 'blockers': len(manifest['blockers'])})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trading-production-readiness-manifest
          path: artifacts/production_readiness/
          if-no-files-found: error
          retention-days: 30
