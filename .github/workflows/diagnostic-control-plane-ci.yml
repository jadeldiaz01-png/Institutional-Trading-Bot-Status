name: Diagnostic control-plane CI

on:
  pull_request:
    paths:
      - '.github/workflows/cp03-fold06-allocation-profile.yml'
      - '.github/workflows/cp03-fold06-low-perturbation-memory.yml'
      - '.github/workflows/diagnostic-control-plane-ci.yml'
      - 'scripts/diagnostics/profile_cp03_fold06_allocations.py'
      - 'scripts/diagnostics/proc_memory_supervisor.py'
      - 'scripts/diagnostics/preflight_cp03_fold06_memory.py'
      - 'scripts/diagnostics/semantic_cp03_fold06_boundaries.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile diagnostic Python
        run: |
          python -m py_compile scripts/diagnostics/profile_cp03_fold06_allocations.py
          python -m py_compile scripts/diagnostics/proc_memory_supervisor.py
          python -m py_compile scripts/diagnostics/preflight_cp03_fold06_memory.py
          python -m py_compile scripts/diagnostics/semantic_cp03_fold06_boundaries.py
      - name: Enforce diagnostic-only invariants
        run: |
          set -euo pipefail
          low=.github/workflows/cp03-fold06-low-perturbation-memory.yml
          alloc=.github/workflows/cp03-fold06-allocation-profile.yml
          profile=scripts/diagnostics/profile_cp03_fold06_allocations.py
          supervisor=scripts/diagnostics/proc_memory_supervisor.py
          grep -q "SCIENTIFIC_SHA: '8da2171e97970c66b3ba5a237c426d9871cc23a1'" "$low"
          grep -q "SCIENTIFIC_SHA: '8da2171e97970c66b3ba5a237c426d9871cc23a1'" "$alloc"
          grep -q "LOW_PERTURBATION_DIAGNOSTIC_ONLY=true" "$low"
          grep -q "ALLOCATION_PROFILE_ONLY=true" "$alloc"
          grep -q "test ! -e artifacts/g4_g13/checkpoint-03-final.json" "$low"
          grep -q "test ! -e artifacts/g4_g13/checkpoint-03-final.json" "$alloc"
          grep -q '0.10 --stdout' "$alloc"
          grep -q 'ALLOC_TRACE' "$profile"
          grep -q 'target.reindex' "$profile"
          grep -q 'target.stack' "$profile"
          grep -q 'target.rename' "$profile"
          grep -q 'train.join' "$profile"
          grep -q 'train.replace' "$profile"
          grep -q 'train.dropna' "$profile"
          ! grep -R -E 'sys\.settrace|tracemalloc' "$profile" "$supervisor" scripts/diagnostics/preflight_cp03_fold06_memory.py
          grep -q '/proc/' "$supervisor"
          grep -q 'smaps_rollup' "$supervisor"
          grep -q -- '--stdout' "$supervisor"
          grep -Fq 'proc_memory_supervisor.py "$science_pid" diagnostics/proc-memory.csv 0.25 --stdout' "$low"
          grep -q 'ALLOC_STREAM_START' "$supervisor"
          grep -q 'ALLOC_SAMPLE' "$supervisor"
          grep -q 'upper_bound' scripts/diagnostics/preflight_cp03_fold06_memory.py
          semantic=scripts/diagnostics/semantic_cp03_fold06_boundaries.py
          grep -q 'SEMANTIC_BOUNDARY' "$semantic"
          grep -q 'train.before' "$semantic"
          grep -q 'train.after' "$semantic"
          grep -Fq 'label = {1: "X", 2: "Xtest"}.get(state["to_numpy_calls"], "to_numpy")' "$semantic"
          grep -Fq 'mark(label + ".before", self)' "$semantic"
          grep -Fq 'mark(label + ".after", out)' "$semantic"
          grep -q 'scaler.fit.before' "$semantic"
          grep -q 'scaler.fit.after' "$semantic"
          grep -Fq 'label = "Xs" if state["transform_calls"] == 1 else "Xts"' "$semantic"
          grep -Fq 'mark(label + ".before", X)' "$semantic"
          grep -Fq 'mark(label + ".after", out)' "$semantic"
          ! grep -E 'memory_usage|copy\(|astype\(|sample\(|choice\(|max_training_rows_per_fold[[:space:]]*=' "$semantic"
          grep -Fq 'SCIENCE_ROOT="$PWD" python ../control/scripts/diagnostics/semantic_cp03_fold06_boundaries.py' "$low"
          grep -Fq 'runpy.run_path(str(science / "scripts/ar_tf_ridge_fold_step.py"), run_name="__main__")' "$semantic"
      - name: Verify TRIAL_ID same-step and step-boundary semantics
        run: |
          set -euo pipefail
          wf=.github/workflows/cp03-fold06-low-perturbation-memory.yml
          grep -Fq 'TRIAL_ID="$(python - <<' "$wf"
          grep -Fq 'test -n "$TRIAL_ID"' "$wf"
          grep -Fq 'export TRIAL_ID' "$wf"
          grep -Fq "printf 'TRIAL_ID=%s\\n' \"\$TRIAL_ID\"" "$wf"
          grep -Fq '>> "$GITHUB_ENV"' "$wf"
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/cp03-fold06-low-perturbation-memory.yml").read_text()
          seal = text.split("- name: Seal diagnostic evidence", 1)[1].split("- name: Upload diagnostic evidence", 1)[0]
          assert "if: always()" in seal
          assert "mkdir -p diagnostics" in seal
          PY
          tmp_env="$(mktemp)"
          TRIAL_ID="$(printf '%s\n' 'ridge:ci-step-boundary')"
          test -n "$TRIAL_ID"
          export TRIAL_ID
          printf 'TRIAL_ID=%s\n' "$TRIAL_ID" > "$tmp_env"
          test "$TRIAL_ID" = 'ridge:ci-step-boundary'
          unset TRIAL_ID
          env -i PATH="$PATH" HOME="$HOME" bash -euo pipefail -c '
            source "$1"
            test "$TRIAL_ID" = "ridge:ci-step-boundary"
          ' _ "$tmp_env"
      - name: Enforce inner training-boundary invariants
        run: |
          set -euo pipefail
          driver=scripts/diagnostics/semantic_cp03_fold06_boundaries.py
          for marker in             train.target.reindex.before train.target.reindex.after             train.target.stack.before train.target.stack.after             train.join.before train.join.after             train.replace.before train.replace.after             train.dropna.before train.dropna.after
          do
            grep -q "\"$marker\"" "$driver"
          done
          ! grep -q 'memory_usage' "$driver"
          ! grep -q 'deep=True' "$driver"
          ! grep -q 'tracemalloc' "$driver"
          ! grep -q 'sys.settrace' "$driver"
          grep -q 'original_reindex(self' "$driver"
          grep -q 'original_stack(self' "$driver"
          grep -q 'original_join(self, other' "$driver"
          grep -q 'original_replace(self' "$driver"
          grep -q 'original_dropna(self' "$driver"

      - name: Simulate abrupt observed-process termination
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          sleep 30 &
          observed_pid=$!
          python scripts/diagnostics/proc_memory_supervisor.py "$observed_pid" "$tmp/proc-memory.csv" 0.05 --stdout >"$tmp/evidence-stream.log" &
          supervisor_pid=$!
          sleep 0.30
          kill -TERM "$observed_pid"
          wait "$observed_pid" || test "$?" -eq 143
          wait "$supervisor_pid"
          test -s "$tmp/proc-memory.csv"
          test "$(wc -l < "$tmp/proc-memory.csv")" -ge 2
          grep -q '^ALLOC_STREAM_START ' "$tmp/evidence-stream.log"
          grep -q '^ALLOC_SAMPLE ' "$tmp/evidence-stream.log"
          python - "$tmp/evidence-stream.log" <<'PY'
          import json,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text().splitlines()
          start=[x for x in lines if x.startswith("ALLOC_STREAM_START ")]
          samples=[x for x in lines if x.startswith("ALLOC_SAMPLE ")]
          assert len(start)==1 and samples
          json.loads(start[0].split(" ",1)[1])
          for line in samples: json.loads(line.split(" ",1)[1])
          PY
      - name: Simulate watchdog deadline and sealed evidence
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          sleep 30 &
          observed_pid=$!
          python scripts/diagnostics/proc_memory_supervisor.py "$observed_pid" "$tmp/proc-memory.csv" 0.05 --stdout >"$tmp/evidence-stream.log" &
          supervisor_pid=$!
          (
            sleep 1
            if kill -0 "$observed_pid" 2>/dev/null; then
              printf 'WATCHDOG_DEADLINE seconds=1 pid=%s\\n' "$observed_pid" | tee "$tmp/watchdog.log"
              kill -TERM "$observed_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!
          set +e; wait "$observed_pid"; rc=$?; set -e
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          wait "$supervisor_pid"
          echo "$rc" > "$tmp/science-exit-code.txt"
          test -s "$tmp/watchdog.log"
          test -s "$tmp/proc-memory.csv"
          (cd "$tmp" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          test -s "$tmp/SHA256SUMS"
          (cd "$tmp" && sha256sum -c SHA256SUMS)
          grep -q '^WATCHDOG_DEADLINE ' "$tmp/watchdog.log"
          grep -q '^ALLOC_SAMPLE ' "$tmp/evidence-stream.log"
          grep -q 'timeout-minutes: 25' .github/workflows/cp03-fold06-low-perturbation-memory.yml
          grep -q 'watchdog_deadline_seconds=900' .github/workflows/cp03-fold06-low-perturbation-memory.yml

      - name: Assert CI never runs scientific fold
        run: |
          set -euo pipefail
          ! grep -E '^[[:space:]]*python[[:space:]].*ar_tf_ridge_fold_step\.py([[:space:]]|$)' .github/workflows/diagnostic-control-plane-ci.yml
