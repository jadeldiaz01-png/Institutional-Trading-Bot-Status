apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p0-data-certifier
  namespace: arc-runners
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: p0-data-certifier-quota
  namespace: arc-runners
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "4"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p0-data-certifier-ingress-deny
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
