apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    institutional.openai/purpose: certification
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-certifier-egress
  namespace: arc-runners
spec:
  podSelector:
    matchLabels:
      institutional.openai/certifier: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
# Deliberately no ingress rule. Runner pods accept no inbound traffic.
# Production deployment must additionally enforce egress allowlisting at the
# CNI/firewall layer for GitHub, GHCR, Tailscale control/DERP, and explicitly
# approved evidence endpoints. This manifest does not claim that runtime proof.
